name: Publication quotidienne d'un article

on:
  schedule:
    # 06h00 UTC chaque jour = 07h00/08h00 heure de Paris selon la saison
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permet aussi un declenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: montres-blog
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: montres-blog/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Generation de l'article du jour
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: Commit et push si un nouvel article a ete cree
        run: |
          git config user.name "totem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/articles data/published.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau fichier a committer (queue de mots-cles epuisee ?)."
          else
            git commit -m "chore: article automatique du $(date -u +%Y-%m-%d)"
            git push
          fi
