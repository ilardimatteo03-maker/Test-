<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Nova · Post NOVACORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500&display=swap" rel="stylesheet">
<style>

  *{margin:0;padding:0;box-sizing:border-box}
  :root{--carbone:#141519;--craie:#F1F0EC;--sable:#D9B4A7;
        --sans:'Archivo',Helvetica,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  html,body{background:#141519}
  .post{position:absolute;top:0;left:0;width:1080px;height:1080px;font-family:var(--sans);
         background-size:cover;background-position:center;overflow:hidden;display:flex}
  .scrim{position:absolute;inset:0}
  .in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;padding:96px}
  .kick{color:var(--craie);font-size:19px;letter-spacing:.36em;text-transform:uppercase;font-weight:600;
         text-shadow:0 2px 16px rgba(0,0,0,.55)}
  .badge{display:inline-block;border:2px solid var(--craie);border-radius:10px;padding:20px 48px;
          font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--craie);
          text-shadow:0 2px 22px rgba(0,0,0,.5);box-shadow:0 16px 60px rgba(0,0,0,.28)}
  .badge sup{font-size:.5em;letter-spacing:0;margin-left:.06em;vertical-align:.9em}
  .hl{font-family:var(--serif);font-style:italic;color:var(--craie);text-shadow:0 2px 18px rgba(0,0,0,.55)}
  .copy{color:rgba(241,240,236,.94);line-height:1.55;max-width:660px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  .pil{color:rgba(241,240,236,.9);text-transform:uppercase;font-weight:600;letter-spacing:.16em;
        text-shadow:0 2px 14px rgba(0,0,0,.55)}

</style></head><body>
<div class="post" style="background-image:url('nova-tissu-rouge.png')">
  <div class="scrim" style="background:radial-gradient(120% 100% at 50% 50%, rgba(20,21,25,.10) 0%, rgba(20,21,25,.40) 100%)"></div>
  <div class="in">
    <div class="badge" style="font-size:60px;padding:26px 62px">NOVACORE<sup>™</sup></div>
  </div>
</div>
</body></html>
