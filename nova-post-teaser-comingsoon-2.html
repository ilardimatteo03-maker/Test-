<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Nova · Teaser Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--carbone:#141519;--craie:#F1F0EC;--sable:#D9B4A7;
        --sans:'Archivo',Helvetica,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  html,body{background:#141519}
  .post{position:absolute;top:0;left:0;width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);
         background-image:url('nova-brassieres-pile.png');background-size:cover;background-position:center 50%;display:flex}
  .scrimT{position:absolute;left:0;right:0;top:0;height:44%;
           background:linear-gradient(to bottom, rgba(20,21,25,.56) 0%, rgba(20,21,25,.12) 66%, transparent 100%)}
  .scrimB{position:absolute;left:0;right:0;bottom:0;height:30%;
           background:linear-gradient(to top, rgba(20,21,25,.58) 0%, rgba(20,21,25,.10) 76%, transparent 100%)}
  .in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;
       justify-content:space-between;text-align:center;padding:104px 90px 96px}
  .top{display:flex;flex-direction:column;align-items:center}
  .wm{fill:var(--craie);width:300px;height:69px;filter:drop-shadow(0 2px 22px rgba(0,0,0,.6))}
  .slogan{font-family:var(--serif);font-style:italic;font-size:42px;color:var(--craie);margin-top:20px;
           text-shadow:0 2px 24px rgba(0,0,0,.62)}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:16px}
  .cs{display:flex;align-items:center;gap:14px;color:var(--craie);font-size:24px;font-weight:600;
       letter-spacing:.42em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.65)}
  .cs .sp{width:16px;height:16px;fill:var(--craie);opacity:.9}
  .url{font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:rgba(241,240,236,.88);font-weight:600;
        text-shadow:0 2px 16px rgba(0,0,0,.6)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="lg-word" viewBox="0 0 520 120">
    <path d="M0 10H20L80 86V10H100V110H80L20 34V110H0Z"/>
    <path fill-rule="evenodd" d="M140 60a50 50 0 1 0 100 0 50 50 0 1 0-100 0Zm20 0a30 30 0 1 1 60 0 30 30 0 1 1-60 0Z"/>
    <path d="M280 10h20l30 76 30-76h20l-40 100h-20Z"/>
    <path d="M460 10h20l40 100h-20l-30-76-30 76h-20Z"/>
  </symbol>
  <symbol id="lg-spark" viewBox="0 0 100 100"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z"/></symbol>
</defs></svg>
<div class="post">
  <div class="scrimT"></div>
  <div class="scrimB"></div>
  <div class="in">
    <div class="top">
      <svg class="wm" viewBox="0 0 520 120"><use href="#lg-word"/></svg>
      <div class="slogan">Become the splendour</div>
    </div>
    <div class="bottom">
      <div class="cs"><svg class="sp" viewBox="0 0 100 100"><use href="#lg-spark"/></svg>Coming soon<svg class="sp" viewBox="0 0 100 100"><use href="#lg-spark"/></svg></div>
      <div class="url">gymwearnova.com</div>
    </div>
  </div>
</div>
</body></html>
