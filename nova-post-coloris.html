<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Nova · Coloris Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--carbone:#141519;--craie:#F1F0EC;--graphite:#44474E;--brume:#B9B7B0;
        --sans:'Archivo',Helvetica,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  html,body{background:var(--craie)}
  .post{position:absolute;top:0;left:0;width:1080px;height:1350px;background:var(--craie);
         font-family:var(--sans);color:var(--carbone);display:flex;flex-direction:column;
         align-items:center;padding:80px 60px 70px}
  .wm{fill:var(--carbone);width:246px;height:57px}
  .slogan{font-family:var(--serif);font-style:italic;font-size:35px;color:var(--graphite);margin-top:12px}
  .mid{flex:1;display:flex;align-items:center;width:100%}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px;width:100%}
  .cell{display:flex;flex-direction:column;align-items:center;gap:13px}
  .ph{width:100%;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:#E7E5DF;
       box-shadow:0 14px 30px rgba(20,21,25,.13)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .nm{font-size:15px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--graphite)}
  .foot{display:flex;flex-direction:column;align-items:center;gap:11px}
  .cs{display:flex;align-items:center;gap:14px;color:var(--carbone);font-size:23px;font-weight:700;
       letter-spacing:.4em;text-transform:uppercase}
  .cs .sp{width:15px;height:15px;fill:var(--carbone)}
  .url{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--brume);font-weight:600}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="lg-word" viewBox="0 0 520 120">
    <path d="M0 10H20L80 86V10H100V110H80L20 34V110H0Z"/>
    <path fill-rule="evenodd" d="M140 60a50 50 0 1 0 100 0 50 50 0 1 0-100 0Zm20 0a30 30 0 1 1 60 0 30 30 0 1 1-60 0Z"/>
    <path d="M280 10h20l30 76 30-76h20l-40 100h-20Z"/>
    <path d="M460 10h20l40 100h-20l-30-76-30 76h-20Z"/>
  </symbol>
  <symbol id="lg-spark" viewBox="0 0 100 100"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z"/></symbol>
</defs></svg>
<div class="post">
  <svg class="wm" viewBox="0 0 520 120"><use href="#lg-word"/></svg>
  <div class="slogan">Become the splendour</div>
  <div class="mid"><div class="grid">
<div class="cell">
        <div class="ph"><img src="nova-brassiere-rouge.png" alt="Brassière Rouge"></div>
        <div class="nm">Rouge</div></div>
<div class="cell">
        <div class="ph"><img src="nova-brassiere-bordeaux.png" alt="Brassière Bordeaux"></div>
        <div class="nm">Bordeaux</div></div>
<div class="cell">
        <div class="ph"><img src="nova-brassiere-rose.png" alt="Brassière Rose poudré"></div>
        <div class="nm">Rose poudré</div></div>
<div class="cell">
        <div class="ph"><img src="nova-brassiere-mocha.png" alt="Brassière Mocha"></div>
        <div class="nm">Mocha</div></div>
<div class="cell">
        <div class="ph"><img src="nova-brassiere-sable.png" alt="Brassière Sable"></div>
        <div class="nm">Sable</div></div>
<div class="cell">
        <div class="ph"><img src="nova-brassiere-carbone.png" alt="Brassière Carbone"></div>
        <div class="nm">Carbone</div></div>
  </div></div>
  <div class="foot">
    <div class="cs"><svg class="sp" viewBox="0 0 100 100"><use href="#lg-spark"/></svg>Coming soon<svg class="sp" viewBox="0 0 100 100"><use href="#lg-spark"/></svg></div>
    <div class="url">gymwearnova.com</div>
  </div>
</div>
</body></html>
