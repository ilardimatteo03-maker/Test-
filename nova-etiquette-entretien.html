<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Nova · Étiquette d'entretien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500&display=swap" rel="stylesheet">
<style>

  *{margin:0;padding:0;box-sizing:border-box}
  :root{--carbone:#141519;--craie:#F1F0EC;--graphite:#44474E;--brume:#B9B7B0;
        --sans:'Archivo',Helvetica,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  body{font-family:var(--sans);color:var(--carbone)}
  .label{width:320px;height:460px;background:var(--craie);color:var(--carbone);font-family:var(--sans);
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:34px 30px;transform-origin:top left}
  .wm{fill:var(--carbone);width:150px;height:35px}
  .desc{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--graphite);margin-top:12px}
  .size{font-weight:800;font-size:34px;margin-top:26px;line-height:1}
  .tech{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
        border:1.4px solid var(--carbone);border-radius:5px;padding:6px 13px;margin-top:24px;color:var(--carbone)}
  .tech sup{font-size:.62em;letter-spacing:0;margin-left:-.06em;vertical-align:.35em}
  .care{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:26px}
  .cs{width:27px;height:27px;fill:none;stroke:var(--carbone);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

  @page{size:50mm 70mm;margin:0}
  html,body{background:#fff}
  .page{position:relative;width:50mm;height:70mm;overflow:hidden;background:var(--craie)}
  .trim{position:absolute;left:3mm;top:3mm;width:44mm;height:64mm;overflow:hidden}
  .scale{transform:scale(.5197);transform-origin:top left}
  .cm{position:absolute;background:var(--carbone)}
  .ptag{position:absolute;left:3mm;bottom:1mm;font-family:var(--sans);font-size:4.6px;letter-spacing:.05em;color:var(--brume)}
</style></head><body>
