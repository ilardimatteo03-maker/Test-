import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ------------------------------------------------------------ aléatoire reproductible
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rnd();

// ------------------------------------------------------------ moteur

// ------------------------------------------------------------ textures procédurales
function canvasTex(w, h, draw, { srgb = true, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.anisotropy = 8;
  return t;
}
function noiseFill(x, w, h, base, amp, scaleX = 1, scaleY = 1, streak = 0) {
  const img = x.createImageData(w, h); const d = img.data;
  const b = new THREE.Color(base);
  // bruit de valeur à deux octaves
  const g = 64, grid = [];
  for (let i = 0; i < (g + 1) * (g + 1); i++) grid.push(rnd());
  const vn = (u, v) => { const x0 = Math.floor(u) % g, y0 = Math.floor(v) % g, fx = u - Math.floor(u), fy = v - Math.floor(v);
    const a = grid[y0 * (g + 1) + x0], b2 = grid[y0 * (g + 1) + x0 + 1], c = grid[(y0 + 1) * (g + 1) + x0], e = grid[(y0 + 1) * (g + 1) + x0 + 1];
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return (a * (1 - sx) + b2 * sx) * (1 - sy) + (c * (1 - sx) + e * sx) * sy; };
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const u = i / w * 16 * scaleX, v = j / h * 16 * scaleY;
    let n = vn(u, v) * 0.6 + vn(u * 3.1, v * 3.1) * 0.3 + rnd() * 0.1 * (1 + streak);
    if (streak) n = n * 0.7 + Math.sin(v * 6 + vn(u * 0.5, v) * 4) * 0.15 * streak;
    const k = 1 + (n - 0.5) * amp;
    const o = (j * w + i) * 4;
    d[o] = Math.min(255, b.r * 255 * k); d[o + 1] = Math.min(255, b.g * 255 * k); d[o + 2] = Math.min(255, b.b * 255 * k); d[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}
const T = {};
T.travertine = (rep = [3, 3]) => canvasTex(512, 512, (x, w, h) => {
  // le travertin : base claire stratifiée, pores allongés
  noiseFill(x, w, h, '#d6ccbb', 0.18, 0.4, 3.0, 1);
  for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(120,100,80,${R(0.08, 0.25)})`; const y = R(0, h), xx = R(0, w);
    x.beginPath(); x.ellipse(xx, y, R(2, 9), R(0.6, 1.6), 0, 0, Math.PI * 2); x.fill(); }
  x.strokeStyle = 'rgba(255,255,255,.05)'; x.lineWidth = 1;
  for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(0, i * h / 6); x.lineTo(w, i * h / 6); x.stroke(); }
}, { repeat: rep });
T.walnut = (rep = [1, 1]) => canvasTex(512, 256, (x, w, h) => {
  noiseFill(x, w, h, '#4b3224', 0.35, 0.3, 4, 2);
}, { repeat: rep });
T.marble = (rep = [1, 1]) => canvasTex(1024, 512, (x, w, h) => {
  noiseFill(x, w, h, '#151413', 0.25, 1, 1);
  x.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 9; k++) { x.strokeStyle = `rgba(200,195,185,${R(0.05, 0.22)})`; x.lineWidth = R(0.6, 2.4);
    x.beginPath(); let px = R(0, w), py = 0; x.moveTo(px, py);
    while (py < h) { px += R(-30, 30); py += R(10, 40); x.lineTo(px, py); } x.stroke(); }
  x.globalCompositeOperation = 'source-over';
}, { repeat: rep });
T.fabric = (base, amp = 0.12, rep = [4, 4]) => canvasTex(256, 256, (x, w, h) => noiseFill(x, w, h, base, amp, 8, 8), { repeat: rep });
T.concrete = (rep = [2, 2]) => canvasTex(512, 512, (x, w, h) => noiseFill(x, w, h, '#77746f', 0.28, 2, 2), { repeat: rep });
T.deck = (rep = [1, 1]) => canvasTex(512, 512, (x, w, h) => {
  noiseFill(x, w, h, '#7c5b40', 0.3, 0.2, 6, 2);
  x.fillStyle = 'rgba(30,20,12,.55)'; for (let i = 0; i < 8; i++) x.fillRect(0, i * h / 8, w, 2);
}, { repeat: rep });
T.stone = (rep = [1, 1]) => canvasTex(512, 512, (x, w, h) => {
  noiseFill(x, w, h, '#cfc6b6', 0.14, 2, 2);
  x.strokeStyle = 'rgba(90,80,70,.35)'; x.lineWidth = 2; x.strokeRect(1, 1, w - 2, h - 2);
}, { repeat: rep });
T.asphalt = (rep = [6, 6]) => canvasTex(512, 512, (x, w, h) => noiseFill(x, w, h, '#1b1b1c', 0.6, 6, 6), { repeat: rep });

// fenêtres d'immeubles : couleur (façade + vitres) et émission (fenêtres allumées)
function windowTextures(style) {
  const cols = 8, rows = 16, w = 256, h = 512;
  const lit = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) lit.push(rnd() < style.lit ? (rnd() < 0.8 ? 'warm' : 'cool') : null);
  const map = canvasTex(w, h, (x) => {
    x.fillStyle = style.facade; x.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const gx = c * w / cols, gy = r * h / rows;
      const grad = x.createLinearGradient(0, gy, 0, gy + h / rows);
      grad.addColorStop(0, style.glassTop); grad.addColorStop(1, style.glassBot);
      x.fillStyle = grad; x.fillRect(gx + style.mx, gy + style.my, w / cols - 2 * style.mx, h / rows - 2 * style.my);
    }
  });
  const em = canvasTex(w, h, (x) => {
    x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const l = lit[r * cols + c]; if (!l) continue;
      const gx = c * w / cols, gy = r * h / rows;
      const k = R(0.45, 1);
      x.fillStyle = l === 'warm' ? `rgba(255,${190 + 30 * k | 0},${120 + 40 * k | 0},${k})` : `rgba(170,200,255,${k * 0.7})`;
      x.fillRect(gx + style.mx, gy + style.my, w / cols - 2 * style.mx, h / rows - 2 * style.my);
    }
  });
  return { map, em };
}

// ------------------------------------------------------------ ciel et ville
function sky({ top, mid, hor, glow, glowDir = [0.3, 0.02, -1], glowPow = 6 }) {
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(top) }, mid: { value: new THREE.Color(mid) }, hor: { value: new THREE.Color(hor) },
      glow: { value: new THREE.Color(glow) }, gdir: { value: new THREE.Vector3(...glowDir).normalize() }, gp: { value: glowPow } },
    vertexShader: 'varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform vec3 top,mid,hor,glow,gdir; uniform float gp; varying vec3 vp;
      void main(){ float y = vp.y; vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, y)); c = mix(c, top, smoothstep(0.15, 0.7, y));
      if (y < 0.0) c = mix(hor, hor*0.5, smoothstep(0.0, -0.2, y));
      float g = pow(max(dot(normalize(vec3(vp.x, max(vp.y,0.0)*1.5, vp.z)), gdir), 0.0), gp);
      c += glow * g * 0.9; gl_FragColor = vec4(c, 1.0); }` });
  const s = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), m);
  scene.add(s);
}
function uvScaleBox(geo, sx, sy, sz, ww, wh) {
  // répète la texture de fenêtres selon la taille réelle des faces
  const uv = geo.attributes.uv;
  const faces = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, uv.getX(i) * faces[f][0] / ww, uv.getY(i) * faces[f][1] / wh);
  }
  uv.needsUpdate = true;
}
function city({ ground = -110, radius = 1100, clear = 170, n = 1100, styles, hmax = 210, center = [0, 0], streetLights = true }) {
  const mats = styles.map(st => { const t = windowTextures(st);
    return new THREE.MeshStandardMaterial({ map: t.map, emissiveMap: t.em, emissive: 0xffffff, emissiveIntensity: st.emi || 0.9,
      roughness: 0.55, metalness: 0.25, envMapIntensity: 0.6 }); });
  for (let i = 0; i < n; i++) {
    const a = R(0, Math.PI * 2), d = clear + Math.pow(rnd(), 0.7) * radius;
    const x = center[0] + Math.cos(a) * d, z = center[1] + Math.sin(a) * d;
    const sx = R(16, 42), sz = R(16, 42);
    const h = R(14, 55) + Math.pow(rnd(), 4) * hmax;
    const geo = new THREE.BoxGeometry(sx, h, sz);
    uvScaleBox(geo, sx, h, sz, 12, 48);
    const m = new THREE.Mesh(geo, mats[i % mats.length]);
    m.position.set(x, ground + h / 2, z); scene.add(m);
    if (h > 150 && rnd() < 0.5) { // couronne lumineuse des tours
      const c = new THREE.Mesh(new THREE.BoxGeometry(sx * 1.01, 1.2, sz * 1.01), new THREE.MeshBasicMaterial({ color: 0xffd9a8 }));
      c.position.set(x, ground + h - 2, z); scene.add(c);
    }
  }
  const g = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 1 }));
  g.rotation.x = -Math.PI / 2; g.position.y = ground; scene.add(g);
  if (streetLights) { // lumières de rue (instances)
    const geo = new THREE.SphereGeometry(0.9, 6, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffc27a });
    const inst = new THREE.InstancedMesh(geo, mat, 3000); const M4 = new THREE.Matrix4(); let k = 0;
    for (let gx = -900; gx <= 900 && k < 3000; gx += 60) for (let gz = -900; gz <= 900 && k < 3000; gz += 14) {
      if (Math.hypot(gx, gz) < clear) continue; M4.makeTranslation(gx + R(-2, 2), ground + 0.5, gz); inst.setMatrixAt(k++, M4);
      if (k < 3000 && rnd() < 0.5) { M4.makeTranslation(gz, ground + 0.5, gx + R(-2, 2)); inst.setMatrixAt(k++, M4); }
    }
    inst.count = k; scene.add(inst);
  }
}
const DUSK_STYLES = [
  { facade: '#202430', glassTop: '#56627c', glassBot: '#1d2433', mx: 2, my: 4, lit: 0.16 },
  { facade: '#2b2b2f', glassTop: '#626a80', glassBot: '#232a38', mx: 4, my: 6, lit: 0.12 },
  { facade: '#252a33', glassTop: '#6d7891', glassBot: '#2b3446', mx: 1, my: 2, lit: 0.22 },
  { facade: '#3b3732', glassTop: '#4c4a50', glassBot: '#1e1e23', mx: 5, my: 7, lit: 0.14 },
  { facade: '#1a1d24', glassTop: '#7a86a0', glassBot: '#30394d', mx: 1, my: 1, lit: 0.08 },
];

// ------------------------------------------------------------ mobilier
const mat = {
  crema: () => new THREE.MeshStandardMaterial({ color: COL.crema, roughness: 0.9 }),
  plaster: () => new THREE.MeshStandardMaterial({ color: '#e7e0d3', roughness: 0.95 }),
  black: () => new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.45, metalness: 0.6 }),
  fabric: (c, amp = 0.15) => new THREE.MeshStandardMaterial({ color: '#ffffff', map: T.fabric(c, amp), roughness: 0.97 }),
  leather: (c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.5 }),
  brass: () => new THREE.MeshStandardMaterial({ color: COL.ottone, roughness: 0.32, metalness: 1 }),
  glass: (op = 0.08) => new THREE.MeshPhysicalMaterial({ color: '#bfd0d8', roughness: 0.02, metalness: 0, transparent: true, opacity: op, envMapIntensity: 1.5 }),
};
function add(geo, m, x, y, z, { cast = true, recv = true, rx = 0, ry = 0, rz = 0, parent = scene } = {}) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.set(rx, ry, rz);
  o.castShadow = cast; o.receiveShadow = recv; parent.add(o); return o;
}
const rb = (w, h, d, r = 0.04, s = 4) => new RoundedBoxGeometry(w, h, d, s, r);
function sofa(x, z, ry = 0, c = COL.talpa) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const m = mat.fabric(c, 0.18);
  add(rb(2.9, 0.22, 1.02, 0.05), mat.fabric(COL.ciocc, 0.1), 0, 0.11, 0, { parent: g });
  add(rb(2.8, 0.2, 0.92, 0.09), m, 0, 0.32, 0.03, { parent: g });
  add(rb(1.38, 0.18, 0.86, 0.09), m, -0.7, 0.5, 0.05, { parent: g });
  add(rb(1.38, 0.18, 0.86, 0.09), m, 0.7, 0.5, 0.05, { parent: g });
  add(rb(2.9, 0.5, 0.22, 0.09), m, 0, 0.62, -0.42, { parent: g });
  add(rb(0.22, 0.42, 1.02, 0.09), m, -1.45, 0.48, 0, { parent: g });
  add(rb(0.22, 0.42, 1.02, 0.09), m, 1.45, 0.48, 0, { parent: g });
  add(rb(0.5, 0.42, 0.14, 0.06), mat.fabric(COL.barolo, 0.12), 0.95, 0.78, -0.25, { parent: g, rx: -0.25, rz: 0.08 });
  return g;
}
function armchair(x, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const m = mat.leather(COL.ciocc);
  add(rb(0.86, 0.36, 0.86, 0.12), m, 0, 0.28, 0, { parent: g });
  add(rb(0.86, 0.5, 0.2, 0.09), m, 0, 0.6, -0.34, { parent: g, rx: -0.12 });
  add(rb(0.16, 0.3, 0.8, 0.07), m, -0.4, 0.5, 0, { parent: g }); add(rb(0.16, 0.3, 0.8, 0.07), m, 0.4, 0.5, 0, { parent: g });
  return g;
}
function lamp(x, z, h = 1.6) {
  add(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 32), mat.brass(), x, 0.01, z);
  add(new THREE.CylinderGeometry(0.01, 0.01, h, 8), mat.brass(), x, h / 2, z);
  const shade = add(new THREE.CylinderGeometry(0.16, 0.24, 0.3, 32, 1, true), new THREE.MeshStandardMaterial({ color: '#f3e7d2', emissive: '#ffcf96', emissiveIntensity: 1.4, side: THREE.DoubleSide, roughness: 1 }), x, h, z, { cast: false });
  const l = new THREE.PointLight('#ffc78a', 6, 7, 1.4); l.position.set(x, h - 0.05, z); l.castShadow = true; l.shadow.mapSize.set(1024, 1024); scene.add(l);
}
function laptop(x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; scene.add(g);
  const al = new THREE.MeshStandardMaterial({ color: '#8d8e90', roughness: 0.35, metalness: 0.9 });
  add(rb(0.32, 0.012, 0.22, 0.004, 2), al, 0, 0.006, 0, { parent: g });
  const lid = new THREE.Group(); lid.position.set(0, 0.012, -0.11); lid.rotation.x = -0.32; g.add(lid);
  add(rb(0.32, 0.21, 0.006, 0.004, 2), al, 0, 0.105, -0.003, { parent: lid });
  const scr = canvasTex(512, 336, (c, w, h) => { const gr = c.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#1b2333'); gr.addColorStop(1, '#0d1018');
    c.fillStyle = gr; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(239,233,222,.85)'; c.font = '400 26px Playfair'; c.fillText('Series A — term sheet', 40, 70);
    c.fillStyle = 'rgba(239,233,222,.35)'; for (let i = 0; i < 9; i++) c.fillRect(40, 100 + i * 22, R(180, 420), 6);
    c.fillStyle = 'rgba(94,27,39,.9)'; c.fillRect(40, 300, 120, 14); });
  add(new THREE.PlaneGeometry(0.3, 0.19), new THREE.MeshBasicMaterial({ map: scr }), 0, 0.105, 0.001, { parent: lid, cast: false });
  return g;
}
function cup(x, y, z) {
  const pts = []; for (let i = 0; i <= 10; i++) { const t = i / 10; pts.push(new THREE.Vector2(0.028 + 0.012 * Math.sin(t * 1.4), t * 0.055)); }
  add(new THREE.LatheGeometry(pts, 32), new THREE.MeshPhysicalMaterial({ color: '#f4efe6', roughness: 0.2, clearcoat: 1 }), x, y + 0.006, z);
  add(new THREE.CylinderGeometry(0.06, 0.055, 0.008, 40), new THREE.MeshPhysicalMaterial({ color: '#f4efe6', roughness: 0.2, clearcoat: 1 }), x, y + 0.004, z);
  add(new THREE.CircleGeometry(0.036, 32), new THREE.MeshStandardMaterial({ color: '#3b2416', roughness: 0.3 }), x, y + 0.055, z, { rx: -Math.PI / 2, cast: false });

function books(x, y, z, ry = 0) {
  const cs = [COL.crema, COL.nero, COL.barolo, COL.talpa]; let yy = y;
  for (let i = 0; i < 4; i++) { const h = R(0.025, 0.04); add(rb(R(0.26, 0.32), h, R(0.2, 0.24), 0.004, 2), new THREE.MeshStandardMaterial({ color: cs[i], roughness: 0.8 }), x + R(-0.02, 0.02), yy + h / 2, z, { ry: ry + R(-0.12, 0.12) }); yy += h; }
}
function chair(x, z, ry = 0, c = COL.crema) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const m = mat.leather(c), steel = mat.black();
  add(rb(0.52, 0.08, 0.5, 0.03), m, 0, 0.46, 0, { parent: g });
  add(rb(0.52, 0.42, 0.06, 0.03), m, 0, 0.72, -0.24, { parent: g, rx: -0.1 });
  for (const [a, b] of [[-0.22, -0.2], [0.22, -0.2], [-0.22, 0.2], [0.22, 0.2]]) add(new THREE.CylinderGeometry(0.012, 0.012, 0.44, 8), steel, a, 0.22, b, { parent: g });

function gessatoTex(bg, ink, op, rep, pitch = 14) {
  return canvasTex(pitch * 18, pitch * 9 * 1.6 * 2 / 2, (c, w, h) => {

    for (let half = 0; half < 2; half++) { const y1 = h * 0.18 + half * h * 0.5, jl = h * 0.22;

}
