<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Nova · Hangtag (prêt à imprimer)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500&display=swap" rel="stylesheet">
<style>

  *{margin:0;padding:0;box-sizing:border-box}
  :root{--carbone:#141519;--craie:#F1F0EC;--graphite:#44474E;--brume:#B9B7B0;
        --sans:'Archivo',Helvetica,Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  body{font-family:var(--sans);color:var(--carbone)}
  .tag{width:300px;height:640px;background:var(--craie);color:var(--carbone);font-family:var(--sans);
       padding:52px 34px 42px;display:flex;flex-direction:column;align-items:center;transform-origin:top left}
  .eyelet{width:26px;height:26px;border-radius:50%;border:2px solid var(--carbone);margin-bottom:40px}
  .spk{fill:var(--carbone)} .wm{fill:var(--carbone)}
  .rule{width:64px;height:1px;background:var(--carbone);margin:26px 0}
  .slogan{font-family:var(--serif);font-style:italic;font-size:27px;text-align:center;line-height:1.2}
  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
  .ncbadge{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
           border:1px solid var(--carbone);border-radius:4px;padding:4px 9px}
  .url{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--graphite)}
  .qrwrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  .qrwrap img{width:214px;height:214px;mix-blend-mode:multiply}

  @page{size:60mm 121mm;margin:0}
  html,body{background:#fff}
  .page{position:relative;width:60mm;height:121mm;overflow:hidden;background:var(--craie);
        page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .trim{position:absolute;left:3mm;top:3mm;width:54mm;height:115mm;overflow:hidden}
  .scale{transform:scale(.680);transform-origin:top left}
  .cm{position:absolute;background:var(--carbone)}
  .ptag{position:absolute;left:3mm;bottom:1.1mm;font-family:var(--sans);font-size:5px;letter-spacing:.06em;color:var(--brume)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="lg-word" viewBox="0 0 520 120">
    <path d="M0 10H20L80 86V10H100V110H80L20 34V110H0Z"/>
    <path fill-rule="evenodd" d="M140 60a50 50 0 1 0 100 0 50 50 0 1 0-100 0Zm20 0a30 30 0 1 1 60 0 30 30 0 1 1-60 0Z"/>
    <path d="M280 10h20l30 76 30-76h20l-40 100h-20Z"/>
    <path d="M460 10h20l40 100h-20l-30-76-30 76h-20Z"/>
  </symbol>
  <symbol id="lg-spark" viewBox="0 0 100 100"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z"/></symbol>
</defs></svg>

  <div class="page">
    <div class="cm" style="left:3mm;top:0;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:0;top:3mm;width:2.4mm;height:0.2mm"></div>
    <div class="cm" style="left:56.8mm;top:0;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:57.6mm;top:3mm;width:2.4mm;height:0.2mm"></div>
    <div class="cm" style="left:3mm;top:118.6mm;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:0;top:117.8mm;width:2.4mm;height:0.2mm"></div>
    <div class="cm" style="left:56.8mm;top:118.6mm;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:57.6mm;top:117.8mm;width:2.4mm;height:0.2mm"></div>
    <div class="trim"><div class="scale"><div class="tag">
        <div class="eyelet"></div>
        <svg viewBox="0 0 100 100" class="spk" style="width:44px;height:44px"><use href="#lg-spark"/></svg>
        <svg viewBox="0 0 520 120" class="wm" style="width:200px;margin-top:22px"><use href="#lg-word"/></svg>
        <div class="rule"></div>
        <div class="slogan">Become<br>the splendour.</div>
        <div class="foot"><span class="ncbadge">NOVACORE™</span><span class="url">gymwearnova.com</span></div></div></div></div>
    <div class="ptag">NOVA · Hangtag · coupe 54×115&nbsp;mm · fond perdu 3&nbsp;mm</div>
  </div>

  <div class="page">
    <div class="cm" style="left:3mm;top:0;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:0;top:3mm;width:2.4mm;height:0.2mm"></div>

    <div class="cm" style="left:0;top:117.8mm;width:2.4mm;height:0.2mm"></div>
    <div class="cm" style="left:56.8mm;top:118.6mm;width:0.2mm;height:2.4mm"></div>
    <div class="cm" style="left:57.6mm;top:117.8mm;width:2.4mm;height:0.2mm"></div>
    <div class="ptag">NOVA · Hangtag verso (Craie uni) · coupe 54×115&nbsp;mm · fond perdu 3&nbsp;mm</div>
  </div>
</body></html>
